  - { id: "370218784710",  scope: org, tier: governance,    desc: "governance folder" }
  - { id: "2144079006133", scope: org, tier: root_of_trust, desc: "Operating Profile (OP)" }
  - { id: "2172078880293", scope: org, tier: root_of_trust, desc: "Ops Integrity (OI)" }
  - { id: "2151742321898", scope: org, tier: root_of_trust, desc: "CSJ" }
  - { id: "2167953632793", scope: org, tier: root_of_trust, desc: "Max Layer 1 pointer" }
  - { id: "7855441749",    scope: org, tier: root_of_trust, desc: "CloudHQ backup mirror (v4.0)" }

