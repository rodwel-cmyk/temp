# Layer 1 linter — DECLARATIVE FLOOR MANIFEST
# ---------------------------------------------------------------------------
# Floors lifted VERBATIM from layer1_lint.py v0.2.8 hardcoded constants
# (REQUIRED_NEVERWRITE_IDS, REQUIRED_DROPZONE_IDS, CANONICAL_PRECEDENCE, GATE-V pin).
# Behaviour-preservation contract: every value here == the original hardcoded value.
# The engine sha1-pins this file and verifies it at load; a missing / unreadable /
# sha1-mismatched manifest aborts with a dedicated init error and exit code 3.
#
# Partition-readiness (F-series): every entry is tagged `scope: org|personal`
# (default org) + a `tier`. The loader PROJECTS these declarative dicts into the
# exact native primitives the legacy engine expects (flat set/list of ID *strings*)
# BEFORE they reach C00-C13; the scope/tier metadata NEVER enters the set-math.
#
# v1.1 (2026-07-25, 869drd6uy): + top-level `tier:` declaration — the forward-compat
# hook for the tier-aware ENGINE/POLICY/SCOPE split. No floor value changed.
# ---------------------------------------------------------------------------
manifest_version: "1.1"
source_engine_version: "0.2.8"

# --- Tier declaration (869drd6uy) -------------------------------------------
# WHICH governance tier this manifest is the policy floor for. Permissions exist
# at three tiers (Organisation -> Personal Level-1 -> Project). The engine
# validates this value against {org, personal, project} at load (fail-closed
# InitError, never a silent default) and exposes it as MANIFEST_TIER; it never
# enters the C00-C13 set-math. Only the personal tier exists today; org/project
# manifests are follow-on work (each generated FROM its tier's source doc and
# sha1-pinned, per the tier-split design: org-floor <= personal-floor <= project-floor).
tier: personal

# --- C10 hardcoded root-of-trust floor (8 IDs) -----------------------------
never_write_ids:
